server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for Resend API to bypass CORS
    location /api/resend/ {
        proxy_pass https://api.resend.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.resend.com;
    }

    # Optional: Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
